name: Docker Hub CI/CD
run-name: ${{ github.actor }} is building and pushing the Docker image 🚀

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Generate version
      id: version
      run: |
        echo "version=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
        platforms: linux/amd64,linux/arm64
    
    - name: Build and push Docker image 
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ steps.version.outputs.version }}
      run: |
        set -e

        echo "ECR_REGISTRY=${ECR_REGISTRY}"
        echo "ECR_REPOSITORY=${ECR_REPOSITORY}"
        echo "IMAGE_TAG=${IMAGE_TAG}"

        if [ -z "${ECR_REGISTRY}" ]; then
          echo "ECR_REGISTRY is empty. Check aws-actions/amazon-ecr-login output."
          exit 1
        fi

        if [ -z "${ECR_REPOSITORY}" ]; then
          echo "ECR_REPOSITORY secret is empty. Set GitHub Actions secret ECR_REPOSITORY to the repo name."
          exit 1
        fi

        if [ -z "${IMAGE_TAG}" ]; then
          echo "IMAGE_TAG is empty. Generate version step must emit a tag."
          exit 1
        fi

        docker buildx inspect --bootstrap

        # 멀티 플랫폼 빌드 및 푸시
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
          -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:v2" \
          --push .
